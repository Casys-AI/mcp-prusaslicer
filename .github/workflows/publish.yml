name: Publish

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify release gates with the qualified native engine
        # Keep the Deno base immutable and the native slicer exact. This mirrors
        # the Debian engine package qualified by the committed reference fixture.
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            --user 0:0 \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            denoland/deno:debian@sha256:2014dc167ece617ef7e7ba40631ac2234c59e75ce693e7cc2dc2602b3c87859d \
            -eu -c '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                prusa-slicer=2.9.2+dfsg-1
              test "$(dpkg-query -W -f=\${Version} prusa-slicer)" = "2.9.2+dfsg-1"
              prusa-slicer --help >/dev/null 2>&1
              PRUSASLICER_RUN_NATIVE=1 deno task release:check
            '

  publish-jsr:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # A push that does not bump the version must not turn the run red:
      # JSR versions are immutable, so "already published" is a no-op here,
      # not a failure.
      - name: Check whether this version is already on JSR
        id: version
        run: |
          NAME=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).name)')
          VER=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')
          BODY=$(curl -s "https://jsr.io/${NAME}/meta.json" || echo '{}')
          PUBLISHED=$(BODY="$BODY" VER="$VER" deno eval 'const m = JSON.parse(Deno.env.get("BODY") ?? "{}"); console.log((Deno.env.get("VER") ?? "") in (m.versions ?? {}))')
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "$NAME@$VER already on JSR: $PUBLISHED"

      - name: Publish to JSR
        if: steps.version.outputs.published != 'true'
        run: deno publish
